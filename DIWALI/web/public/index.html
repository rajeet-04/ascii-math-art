<script>
"use strict";
// Happy Diwali: fireworks over water, written in letters. rajeet-04, 2026.
// A browser port of DIWALI/diwali.py: the same maths, drawn live to a canvas.

const LOOP = 26, G_UP = 4.0, G = 1.1, DRAG = 0.85, CW = 9, CH = 15;
// the letter grid follows the screen: wide screens get 128 columns, phones fewer, rows fill the height
let W, H, COLS, ROWS, ASPECT, F, AIM_Y, TALL, R = 1, ZOOM = 1;
function measure() {
  const w = innerWidth, h = innerHeight;

  const tilt = Math.max(0.27, 0.22 / (F * 0.5 * ASPECT));           // tall screens: horizon about 3/4 down, water below
  AIM_Y = 0.55 + 8 * tilt;
  ZOOM = TALL ? 1 : Math.min(1.4, 2.2 / F);                        // wide screens: grow the greeting back to ~70% width
  R = Math.min(2, Math.max(1, w * (devicePixelRatio || 1) / W));     // draw at the screen's real pixel density (never more), so glyphs stay sharp
}
measure();
const AFTERGLOW = 0.6;

// glyph tiers from faint to dense; a cell picks its tier by brightness
const TIERS = [".,'`:;", "~-=+<>^\"", "ocaesuzrv", "#%&@$MW8"];
const GLYPHS = [...new Set([" ", ...TIERS.join(""), ..."*|/\\_-:.~+"])];
const CODE = Object.fromEntries(GLYPHS.map((g, i) => [g, i]));
const TIER_LUT = TIERS.map(t => Array.from({ length: 8 }, (_, k) => CODE[t[k % t.length]]));

const [STAR, CITY, WINDOW, GOLD, SAFFRON, RED, MAGENTA, GREEN, BLUE, WHITE, SILVER, HAPPY, DIWALI] = [...Array(13).keys()];
const [POINT, STREAK, WATER] = [0, 1, 2];
const [PEONY, CHRYS, RING, WILLOW, PALM] = [0, 1, 2, 3, 4];
const COLORS = [[190, 205, 255], [86, 96, 136], [255, 186, 104], [255, 204, 84], [255, 140, 40], [255, 62, 72],
  [255, 84, 200], [90, 232, 150], [96, 156, 255], [255, 250, 240], [214, 226, 255], [255, 132, 196], [255, 212, 120]];

const clamp01 = x => Math.min(1, Math.max(0, x));
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(x));     // cosine ease 0 -> 1
const mod = (a, n) => ((a % n) + n) % n;

function rng(seed) {                                                // mulberry32, reproducible

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}

// flight: exact solution of dv/dt = -k v - g y, written into D = [x, y, z, vx, vy, vz]
const D = new Float64Array(6);
function drag(cx, cy, cz, vx, vy, vz, tau, k, g) {

  D[3] = vx * e; D[4] = vy * e - g / k * (1 - e); D[5] = vz * e;

function fibSphere(n) {                                             // golden-angle spiral over a sphere
  const out = [];
  for (let i = 0; i < n; i++) {
    const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), a = (i + 0.5) * Math.PI * (3 - Math.sqrt(5));

}
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

function ringDirs(n, normal) {
  normal = norm(normal);
  const u = norm(cross(normal, [0.3, 1, 0.2])), w = cross(normal, u), out = [];
  for (let i = 0; i < n; i++) {

}

// the show: every shell is planned once, then evaluated at any time t
const KIND = { [PEONY]: [2.0, 2, 0.05, 0.85, 1.0], [CHRYS]: [2.3, 6, 0.055, 0.85, 1.0], [RING]: [1.9, 2, 0.05, 0.9, 1.0],
  [WILLOW]: [3.6, 10, 0.10, 1.6, 0.7], [PALM]: [2.6, 7, 0.07, 1.1, 1.0] };       // life, trails, spacing, drag, gravity
const PALETTE = [[GOLD, SAFFRON], [MAGENTA, WHITE], [GREEN, GOLD], [BLUE, SILVER], [RED, GOLD], [SAFFRON, RED], [WHITE, MAGENTA]];

function starsOf(kind, r, tilt, [col, col2]) {
  let d, base, late;
  if (kind === RING) {
    d = ringDirs(120, tilt).concat(fibSphere(70).map(v => v.map(c => c * 0.42)));
    base = d.map((_, i) => i < 120 ? col : col2); late = d.map((_, i) => i < 120 ? col2 : col);
    return { d, base, late };
  }
  if (kind === PALM) {
    d = [];
    for (const arm of fibSphere(14).filter(v => v[1] > -0.2))
      for (let k = 0; k < 18; k++) { const f = 0.55 + 0.45 * k / 17; d.push(arm.map(c => c * f)); }
  } else d = fibSphere({ [PEONY]: 240, [CHRYS]: 170, [WILLOW]: 150 }[kind]);
  d = d.map(v => { const f = 1 + 0.10 * r.normal(); return v.map(c => c * f); });
  return { d, base: d.map(() => col), late: d.map(() => kind === WILLOW ? SILVER : col2) };
}

function makeShell(t0, x, z, h, kind, pal, speed, r) {
  const vy = Math.sqrt(2 * G_UP * h), tr = vy / G_UP;              // just enough to stop at height h
  const s = { t0, x, z, kind, speed, vy, tr, drift: r.uniform(-0.35, 0.35), shed: Array.from({ length: 16 }, () => [r(), r(), r(), r()]) };
  s.tb = t0 + tr; s.top = [x + s.drift * tr, h, z];
  if (kind !== null) {
    Object.assign(s, starsOf(kind, r, [r.normal(), r.normal(), r.normal()], pal));
    s.rand = s.d.map(() => r());
  }

}

function program() {
  const r = rng(7), shells = [];
  let t = 0.9;
  while (t < 14.4) {
    const busy = 1 + 1.6 * ease((t - 6) / 8);                       // the show builds up
    shells.push(makeShell(t, r.uniform(-4.5, 4.5), r.uniform(-5, 1.5), r.uniform(3.6, 6.2), (r() * 5) | 0,
      PALETTE[(r() * PALETTE.length) | 0], r.uniform(1.6, 2.4), r));
    t += r.uniform(0.55, 1.3) / busy;
  }
  for (let i = 0; i < 9; i++)                                       // finale: a fan of shells together
    shells.push(makeShell(14.6 + 0.11 * i, -5 + 10 * i / 8, -3.5 + r.uniform(-1, 1), 4.6 + 1.2 * Math.sin(i),
      [CHRYS, PEONY, WILLOW][i % 3], PALETTE[i % PALETTE.length], 2.2, r));
  for (let i = 0; i < 6; i++) {                                     // side shots while the greeting hangs
    const side = i % 2 ? -1 : 1;
    shells.push(makeShell(19.0 + 0.55 * i, side * r.uniform(4.2, 5.6), r.uniform(-4, -1), r.uniform(2.8, 3.6),
      [PEONY, RING][i % 2], PALETTE[(i * 3) % PALETTE.length], 1.5, r));
  }
  return shells;
}
const SHELLS = program();

// particles of one frame
const MAXP = 120000;
const PX = new Float32Array(MAXP), PY = new Float32Array(MAXP), PZ = new Float32Array(MAXP);
const VX = new Float32Array(MAXP), VY = new Float32Array(MAXP), VZ = new Float32Array(MAXP);
const PS = new Float32Array(MAXP), PT = new Uint8Array(MAXP), PM = new Uint8Array(MAXP);
let NP = 0;
function add(x, y, z, vx, vy, vz, s, tag, mode) {
  if (NP >= MAXP || s <= 0.03) return;
  PX[NP] = x; PY[NP] = y; PZ[NP] = z; VX[NP] = vx; VY[NP] = vy; VZ[NP] = vz; PS[NP] = s; PT[NP] = tag; PM[NP] = mode; NP++;
}

function rocket(s, a) {
  // the climbing shell: a hot head, a fading gold tail, sparks shed behind
  for (let j = 0; j < 14; j++) {
    const u = a - j * 0.03;
    if (u <= 0) break;
    add(s.x + s.drift * u, s.vy * u - 0.5 * G_UP * u * u, s.z, s.drift, s.vy - G_UP * u, 0,
      j === 0 ? 1.2 : Math.pow(1 - j / 14, 1.3), j === 0 ? WHITE : GOLD, j === 0 ? POINT : STREAK);
  }
  for (const q of s.shed) {
    const age = ((a * 2.5 + q[0]) % 1) * 0.6, born = a - age;
    if (born <= 0) continue;
    drag(s.x + s.drift * born, s.vy * born - 0.5 * G_UP * born * born, s.z,
      (q[1] - 0.5) * 0.5, (q[2] - 0.5) * 0.3, (q[3] - 0.5) * 0.5, age, 2.0, 1.4);
    add(D[0], D[1], D[2], D[3], D[4], D[5], 0.6 * (1 - age / 0.6), SAFFRON, POINT);
  }
}

function burst(s, b) {
  const [life, nt, dt, k, gk] = KIND[s.kind], [cx, cy, cz] = s.top;
  for (let j = 0; j < nt; j++) {
    const tau = b - j * dt;
    if (tau <= 0) break;
    for (let i = 0; i < s.d.length; i++) {
      const r = s.rand[i], span = life * (0.75 + 0.5 * r), v = s.d[i];
      drag(cx, cy, cz, v[0] * s.speed, v[1] * s.speed, v[2] * s.speed, tau, k, G * gk);
      const fade = Math.pow(clamp01(1 - tau / span), 1.4);
      if (j === 0) {
        const late = tau > 0.7 * span, strobe = mod(r * 53 + tau * 23, 1) > 0.45;   // crackle as stars burn out
        const shade = fade * (1 + 1.8 * Math.exp(-tau * 9)) * (late ? (strobe ? 1.4 : 0) : 1);
        add(D[0], D[1], D[2], D[3], D[4], D[5], shade, tau > 0.55 * span ? s.late[i] : s.base[i], POINT);
      } else add(D[0], D[1], D[2], D[3], D[4], D[5], 1.05 * fade * Math.pow(1 - j / nt, 1.1), s.base[i], STREAK);
    }
  }
}

// the greeting: written by the stars of one large shell
const TEXT_C = [0, 4.3, -1];
const T_BURST = 16.9, T_FLY = 1.1, T_FALL = 22.3, T_GONE = 2.6;

function lettering(tall) {
  // "Happy" in italics over spaced capitals, a flourish between, sampled into 3D points
  const c = document.createElement("canvas"); c.width = 1200; c.height = 540;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.fillStyle = g.strokeStyle = "#fff"; g.textBaseline = "middle"; g.lineJoin = "round";
  // tall screens set "Happy" larger so it uses the line's width as well
  const hy = tall ? 150 : 140;
  g.font = `italic bold ${tall ? 250 : 205}px Georgia, 'Times New Roman', serif`; g.textAlign = "center"; g.lineWidth = tall ? 5 : 4;
  g.fillText("Happy", 600, hy); g.strokeText("Happy", 600, hy);
  g.font = "bold 205px Georgia, 'Times New Roman', serif"; g.textAlign = "left"; g.lineWidth = 6;
  const word = "DIWALI", gap = 30, widths = [...word].map(ch => g.measureText(ch).width);
  let x = 600 - (widths.reduce((a, b) => a + b) + gap * 5) / 2;
  [...word].forEach((ch, i) => { g.fillText(ch, x, 400); g.strokeText(ch, x, 400); x += widths[i] + gap; });
  g.lineWidth = 5; g.beginPath();
  for (let i = 0; i <= 300; i++) { const a = -1 + 2 * i / 300; g.lineTo(600 + 270 * a, 262 + 9 * Math.sin(a * 3 * Math.PI) * (1 - a * a)); }
  g.stroke();
  g.beginPath(); g.moveTo(600, 248); g.lineTo(614, 262); g.lineTo(600, 276); g.lineTo(586, 262); g.fill();

  for (let y = 0; y < 540; y += 4) for (let x2 = 0; x2 < 1200; x2 += 4)

      // tall screens: condensed letters, stretched upward into the spare height
      P.push([(x2 - 600) * s, TEXT_C[1] + (tall ? 1.3 : 0) + (270 - y) * s * (tall ? 1.5 : 1), TEXT_C[2] + 0.02 * Math.sin(x2 * 0.05)]);
      T.push(y < 230 ? HAPPY : DIWALI);

}
let TXT_P, TXT_TAG, XN, TXT_R, HELD, TEXT_TALL;
function buildText() {                                              // rebuilt when the screen turns or widens
  TEXT_TALL = `${TALL}${ZOOM.toFixed(2)}`;
  ({ P: TXT_P, T: TXT_TAG } = lettering(TALL));
  const xs = TXT_P.map(p => p[0]), lo = Math.min(...xs), hi = Math.max(...xs);

}
buildText();
const TXT_SHELL = makeShell(0, 0, TEXT_C[2], TEXT_C[1], null, null, 0, rng(5));
Object.assign(TXT_SHELL, { t0: T_BURST - TXT_SHELL.tr, tb: T_BURST, drift: 0, top: TEXT_C.slice() });

function greeting(t) {
  const [Cx, Cy, Cz] = TEXT_C;
  for (let i = 0; i < TXT_P.length; i++) {
    const u = clamp01((t - T_BURST - 0.8 * XN[i]) / T_FLY);         // written left to right
    const tau = t - T_FALL - 0.9 * XN[i], P = TXT_P[i];             // dissolves left to right
    HELD[i] = u >= 1 && tau <= 0 ? 1 : 0;
    if (u > 0 && u < 1) {

      const e = 1 - (1 - u) ** 3, de = 3 * (1 - u) ** 2, a = 1 - e, b = e, k = de / T_FLY;
      const q = [0, 1, 2].map(n => TEXT_C[n] + 1.7 * (P[n] - TEXT_C[n]));
      const p = [0, 1, 2].map(n => a * a * TEXT_C[n] + 2 * a * b * q[n] + b * b * P[n]);
      const v = [0, 1, 2].map(n => (2 * a * (q[n] - TEXT_C[n]) + 2 * b * (P[n] - q[n])) * k);
      add(p[0], p[1], p[2], v[0], v[1], v[2], 1.1 - 0.3 * u, u < 0.5 ? WHITE : TXT_TAG[i], STREAK);
    } else if (tau > 0 && tau < T_GONE) {
      const r = TXT_R[i];
      drag(P[0], P[1], P[2], (r[0] - 0.5) * 0.6, (r[1] - 0.5) * 0.4, (r[2] - 0.5) * 0.6, tau, 1.4, 0.9);
      add(D[0], D[1], D[2], D[3], D[4], D[5], Math.pow(1 - tau / T_GONE, 1.2), tau > 1 ? SAFFRON : TXT_TAG[i], STREAK);

// the city across the water: towers, two temple domes with spires, lit windows
const TOWN = (() => {
  const r = rng(3), pts = [], K = [], lit = [];
  let frontX = [], frontH = [];
  for (const [layer, [z, hmax, step]] of [[-16, 1.9, 0.09], [-11.5, 1.2, 0.07]].entries()) {
    const edges = [], tops = [];
    let acc = 0;
    for (let i = 0; i < 60; i++) { acc += r.uniform(0.6, 1.9); edges.push(acc - 32); tops.push(r.uniform(0.3, 1) * hmax); }
    const xs = [], hs = [], ids = [];
    for (let x = -24; x < 24; x += step) {
      let idx = edges.findIndex(e => e >= x); if (idx < 0) idx = 59;
      let h = tops[idx];
      if (layer === 1) [[-3.2, 0.55], [4.1, 0.42]].forEach(([cx, rr], n) => {
        const q = Math.max(1 - ((x - cx) / rr) ** 2, 0);
        if (q > 0) { h = Math.max(h, 0.9 + rr * 1.15 * Math.sqrt(q)); idx = 100 + n; }
        if (Math.abs(x - cx) < step * 0.6) h = 0.9 + rr * 1.15 + 0.55;          // spire
      });
      xs.push(x); hs.push(h); ids.push(idx);
      for (let y = 0; y < h; y += step) {
        pts.push([x, y, z]); K.push(2 + idx + 200 * layer);
        lit.push(idx < 100 && mod(Math.floor(y / 0.16) * 7 + Math.floor(x / 0.2) * 13 + idx * 3, 11) < 3 && y < h - 0.12);
      }
    }
    frontX = xs; frontH = hs;
  }

})();
const ROOF = [];
for (let x = -12; x < 12; x += 0.11) {
  const i = Math.min(TOWN.frontX.length - 1, Math.max(0, Math.round((x + 24) / 0.07)));
  ROOF.push([x, TOWN.frontH[i] + 0.04]);
}
const SKY = (r => Array.from({ length: 420 }, () => [r(), r(), r()]))(rng(23));
const ROOF_TAGS = [GOLD, RED, GREEN, SAFFRON, MAGENTA];

function show(t) {

    const a = t - s.t0, b = t - s.tb;

      flash += (s.kind === null ? 2.5 : s.d.length / 200) * Math.exp(-b * 7);

  greeting(t);
  ROOF.forEach(([x, h], i) => {                                     // rooftop lamps with a chase
    const chase = Math.max(Math.sin(x * 2.6 - t * 3.5), 0) ** 3;
    add(x, h, -11.4, 0, 0, 0, (0.35 + 0.65 * chase) * ease(t / 1.5), ROOF_TAGS[((i / 3) | 0) % 5], POINT);
  });

    const az = (r0 - 0.5) * 1.6, el = 0.04 + 1.22 * r1 ** 1.3, tw = 0.5 + 0.5 * Math.sin(t * (0.8 + 2 * r2) + r0 * 50);
    add(60 * Math.sin(az) * Math.cos(el), 60 * Math.sin(el), -60 * Math.cos(az) * Math.cos(el), 0, 0, 0,
      (0.10 + 0.30 * tw ** 4) * ease(t / 2), STAR, POINT);

// camera: low by the water, looking up into the sky, drifting slowly
let CAM;
function camera(t) {
  const drift = [0.6 * Math.sin(t * 0.11), 0.05 * Math.sin(t * 0.37), 0];
  const lift = 0.45 * ease((t - 16) / 2.5) * (1 - ease((t - 23.5) / 2));

const S = new Float64Array(3);                                      // [column, row, depth]
function screen(x, y, z) {
  const { eye, fwd, right, up } = CAM, rx = x - eye[0], ry = y - eye[1], rz = z - eye[2];
  const X = rx * right[0] + ry * right[1] + rz * right[2], Y = rx * up[0] + ry * up[1] + rz * up[2];
  const Z = rx * fwd[0] + ry * fwd[1] + rz * fwd[2], zz = Math.max(Z, 0.2);
  S[0] = (0.5 + X / zz * F * 0.5) * COLS; S[1] = (0.5 - Y / zz * F * 0.5 * ASPECT) * ROWS; S[2] = Z;
}

// letters
let N, part, depth, lum, tag, char, spark, NOISE;
function grids() {
  N = COLS * ROWS;
  part = new Int32Array(N); depth = new Float32Array(N); lum = new Float32Array(N);
  tag = new Uint8Array(N); char = new Uint8Array(N); spark = new Float32Array(N);
  NOISE = Float32Array.from({ length: N }, (_, i) => mod(Math.sin((i / COLS | 0) * 12.9898 + (i % COLS) * 78.233) * 43758.5453, 1));
}
grids();
const BOUND = [CODE["|"], CODE["/"], CODE["-"], CODE["\\"]], MOTION = [CODE["-"], CODE["\\"], CODE["|"], CODE["/"]];
const angleBin = (y, x) => Math.round(mod(Math.atan2(y, x), Math.PI) / (Math.PI / 4)) % 4;
const SPOKES = [[0, 2, "-"], [0, -2, "-"], [1, 0, "|"], [-1, 0, "|"], [1, 1, "\\"], [-1, -1, "\\"], [1, -1, "/"], [-1, 1, "/"]];

function flare(cy, cx, reach, colour, power = 1) {
  // an eight-spoke flare; the diagonal spokes are half as long and dimmer
  for (const [dy, dx, mark] of SPOKES) {
    const diag = Math.abs(dx) === 1, n = diag ? Math.max(reach >> 1, 1) : reach;
    for (let k = 1; k <= n; k++) {
      const y = cy + dy * k, x = cx + dx * k, v = power * (1 - k / (n + 1)) * (diag ? 0.65 : 1);
      if (y < 0 || y >= ROWS || x < 0 || x >= COLS) continue;
      const c = y * COLS + x;
      if (lum[c] < v) { char[c] = CODE[mark]; lum[c] = v; tag[c] = colour; }
    }
  }
  const c = cy * COLS + cx; char[c] = CODE["*"]; lum[c] = 1; tag[c] = WHITE;
}

function frame(t) {
  const { flash, cores, active } = show(t);
  camera(t);
  part.fill(-1); depth.fill(999); lum.fill(0); tag.fill(0); char.fill(0); spark.fill(0);
  const fadeIn = ease(t / 1.5), pts = TOWN.pts;

  // solid things: city and held lettering, nearest point per cell (z-buffer)
  const solid = (x, y, z, k, s, tg) => {
    screen(x, y, z);
    const ix = S[0] | 0, iy = S[1] | 0;
    if (S[0] < 0 || ix >= COLS || S[1] < 0 || iy >= ROWS || S[2] <= 0.2) return;
    const c = iy * COLS + ix;
    if (S[2] < depth[c]) { depth[c] = S[2]; part[c] = k; lum[c] = s; tag[c] = tg; }
  };
  const win = new Uint8Array(pts.length);
  for (let i = 0; i < pts.length; i++) {
    const r = TOWN.rand[i];
    win[i] = TOWN.lit[i] && r < 0.85 + 0.15 * Math.sin(t * 0.7 + r * 40) ? 1 : 0;
    solid(pts[i][0], pts[i][1], pts[i][2], TOWN.K[i], (win[i] ? 0.55 : 0.09 + 0.22 * flash) * fadeIn, win[i] ? WINDOW : CITY);
  }
  for (let i = 0; i < TXT_P.length; i++) if (HELD[i]) {
    const p = TXT_P[i];
    solid(p[0], p[1], p[2], 1, 0.78 + 0.22 * Math.sin(t * 3.2 - p[0] * 1.5), TXT_TAG[i]);
  }

  // boundaries: a neighbour that is open sky or a different part well behind
  const lit = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = y * COLS + x, p = part[c];
    if (p < 0) continue;
    let gx = 0, gy = 0, edge = false;
    for (const [dy, dx] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
      const yy = y + dy, xx = x + dx, inside = yy >= 0 && yy < ROWS && xx >= 0 && xx < COLS;
      const nc = yy * COLS + xx, np = inside ? part[nc] : -1;
      const open = np < 0 || (np !== p && depth[nc] > depth[c] + 0.5);
      if (open) { gx += dx; gy += dy; edge = true; }
    }
    const words = tag[c] === HAPPY || tag[c] === DIWALI, n = NOISE[c];
    if (words) lit.push(c);
    const tier = words ? 3 : lum[c] < 0.3 ? 0 : lum[c] < 0.55 ? 1 : lum[c] < 0.8 ? 2 : 3;
    const step = (Math.floor(n * 64) + Math.floor(t * 4 + n * 3)) % 8;
    char[c] = edge && !words ? (gx === 0 && gy === 0 ? CODE["+"] : BOUND[angleBin(gy, gx)]) : TIER_LUT[tier][step];
    if (tag[c] === WINDOW) char[c] = n < 0.33 ? CODE[":"] : CODE["."];
    else if (tag[c] === CITY && !edge) char[c] = n < 0.25 ? CODE["."] : 0;
    if (edge) lum[c] = Math.max(lum[c], tag[c] === CITY ? 0.22 + 0.3 * flash : 0.9);
  }

  // sparks and their rippling reflections; the brightest spark wins its cell
  let drawn = 0;
  const plot = (x, y, z, vx, vy, vz, s, tg, mode) => {
    if (s <= 0.03) return;
    screen(x, y, z);
    const fx = S[0], fy = S[1], fz = S[2], ix = fx | 0, iy = fy | 0;
    if (fx < 0 || ix >= COLS || fy < 0 || iy >= ROWS || fz <= 0.2) return;
    const c = iy * COLS + ix;
    if (part[c] >= 0 && depth[c] < fz) return;                     // behind the city or the letters
    if (s <= spark[c]) return;
    spark[c] = s; drawn++;
    if (mode === WATER) char[c] = (iy + ix) % 3 === 0 ? CODE["-"] : CODE["~"];
    else if (mode === STREAK) {
      screen(x + vx * 0.06, y + vy * 0.06, z + vz * 0.06);
      char[c] = MOTION[angleBin((S[1] - fy) * CH, (S[0] - fx) * CW)];
    } else char[c] = s < 0.22 ? CODE["."] : s < 0.5 ? CODE[":"] : s < 0.9 ? CODE["+"] : CODE["*"];
    lum[c] = Math.min(s, 1); tag[c] = tg;
  };
  for (let i = 0; i < NP; i++) {
    plot(PX[i], PY[i], PZ[i], VX[i], VY[i], VZ[i], PS[i], PT[i], PM[i]);
    if (PY[i] > 0.02) {
      const y = -PY[i];
      plot(PX[i] + 0.05 * Math.sin(y * 9 + t * 2.1 + PZ[i]), y, PZ[i], VX[i], -VY[i], VZ[i],
        PS[i] * 0.3 * (1 - ease(PY[i] / 9)), PT[i], WATER);
    }
  }
  for (let i = 0; i < pts.length; i += 2) if (win[i]) plot(pts[i][0], -pts[i][1], pts[i][2], 0, 0, 0, 0.16, WINDOW, WATER);

  // a flare the instant a shell opens, and glints wandering over the lettering
  for (const [pos, k] of cores) {
    screen(pos[0], pos[1], pos[2]);
    if (S[2] > 0.2 && S[1] >= 0 && S[1] < ROWS && S[0] >= 0 && S[0] < COLS) flare(S[1] | 0, S[0] | 0, (3 + 8 * k) | 0, WHITE);
  }
  for (let n = 0; n < 3 && lit.length; n++) {
    const phase = t * 1.6 + n * 0.37, c = lit[Math.floor(Math.abs(Math.sin(Math.floor(phase) * 91.7 + n * 13.1)) * 1e4) % lit.length];
    flare((c / COLS) | 0, c % COLS, (2 + 4 * Math.sin((phase % 1) * Math.PI)) | 0, GOLD, 0.9);
  }
  return { active, drawn };
}

// pixels
const view = document.getElementById("view"), out = view.getContext("2d");
const art = document.createElement("canvas"), ink = art.getContext("2d");
const halo1 = document.createElement("canvas"), halo2 = document.createElement("canvas");
function size() {
  for (const [c, k] of [[view, 1], [art, 1], [halo1, 5], [halo2, 14]]) { c.width = Math.max(1, W * R / k | 0); c.height = Math.max(1, H * R / k | 0); }
  ink.fillStyle = "#000"; ink.fillRect(0, 0, W * R, H * R);
  // one tinted row of glyphs per colour, rendered at the drawing density
  atlas.width = Math.ceil(CW * R) * GLYPHS.length; atlas.height = Math.ceil(CH * R) * COLORS.length;
  const g = atlas.getContext("2d"), cw = Math.ceil(CW * R), ch = Math.ceil(CH * R);
  g.font = `${14 * R}px Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace`;
  g.textAlign = "center"; g.textBaseline = "middle";
  COLORS.forEach(([r, gg, b], row) => {
    g.fillStyle = `rgb(${r},${gg},${b})`;
    GLYPHS.forEach((c, i) => g.fillText(c, i * cw + cw / 2, row * ch + ch / 2 + R));
  });
}
const atlas = document.createElement("canvas");
size();

function paint(t, stats) {
  ink.globalCompositeOperation = "source-over"; ink.globalAlpha = 1;
  const VW = W * R, VH = H * R, cw = Math.ceil(CW * R), ch = Math.ceil(CH * R), dx = CW * R, dy = CH * R;
  ink.fillStyle = `rgba(0,0,0,${1 - AFTERGLOW})`; ink.fillRect(0, 0, VW, VH);   // previous frame fades
  ink.globalCompositeOperation = "lighten";
  for (let c = 0; c < N; c++) {
    const g = char[c], l = lum[c];
    if (!g || l < 0.02) continue;
    ink.globalAlpha = Math.min(l, 1);
    ink.drawImage(atlas, g * cw, tag[c] * ch, cw, ch, (c % COLS) * dx, ((c / COLS) | 0) * dy, cw, ch);
  }
  out.globalCompositeOperation = "source-over"; out.globalAlpha = 1;
  out.drawImage(art, 0, 0);
  out.imageSmoothingEnabled = true; out.imageSmoothingQuality = "high";
  out.globalCompositeOperation = "lighter";                        // bloom: shrink, enlarge, add back
  for (const [h, gain] of [[halo1, 0.75], [halo2, 0.45]]) {
    const g = h.getContext("2d"); g.imageSmoothingQuality = "high";
    g.clearRect(0, 0, h.width, h.height); g.drawImage(art, 0, 0, h.width, h.height);
    out.globalAlpha = gain; out.drawImage(h, 0, 0, VW, VH);
  }
  out.globalCompositeOperation = "source-over"; out.globalAlpha = 1;
  out.font = `${15 * R}px Menlo, Consolas, monospace`; out.textAlign = "right";
  [`${t.toFixed(2).padStart(5)} s`, `shells ${String(stats.active).padStart(2)}`, `sparks ${String(stats.drawn).padStart(5)}`, "rajeet-04 · 2026"]
    .forEach((s, i) => { out.fillStyle = i < 3 ? "rgb(150,120,70)" : "rgb(120,110,130)"; out.fillText(s, VW - 28 * R, (36 + 20 * i) * R); });
}

let t = 0, running = true, last = null;
const replay = () => { t = 0; ink.globalCompositeOperation = "source-over"; ink.globalAlpha = 1; ink.fillStyle = "#000"; ink.fillRect(0, 0, W * R, H * R); };
addEventListener("keydown", e => {
  if (e.key === " ") { running = !running; e.preventDefault(); }
  else if (e.key === "r" || e.key === "R") replay();
  else if (e.key === "s" || e.key === "S") Object.assign(document.createElement("a"), { href: view.toDataURL("image/png"), download: `diwali_${Date.now()}.png` }).click();
});
view.addEventListener("click", () => { running = !running; });
let resizing;
addEventListener("resize", () => {                                  // rotate or resize: rebuild the grid
  clearTimeout(resizing);
  resizing = setTimeout(() => { measure(); grids(); size(); if (`${TALL}${ZOOM.toFixed(2)}` !== TEXT_TALL) buildText(); }, 150);
});

function tick(now) {
  requestAnimationFrame(tick);
  if (last !== null && now - last < 1000 / 31) return;              // about 30 frames per second
  const dt = last === null ? 0 : (now - last) / 1000;
  last = now;
  if (!running) return;
  t += Math.min(dt, 1 / 15);
  if (t > LOOP) replay();
  paint(t, frame(t));
}
requestAnimationFrame(tick);
</script>
</body>
</html>
