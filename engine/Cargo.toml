[package]
name = "ascii-math-art"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Streaming video to pixel art and ASCII animation"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
font8x8 = "0.3"
rayon = "1.10"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
